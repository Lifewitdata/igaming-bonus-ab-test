[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bonus-ab-test"
version = "0.2.0"
description = "A/B test analytics toolkit for an iGaming deposit-bonus campaign: funnel analysis, significance testing, ROI, and segmentation, built on Polars."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
dependencies = [
    "polars>=1.0",
    "duckdb>=1.1",
    "streamlit>=1.35",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "click>=8.1",
    "tabulate>=0.9",
    "pandas>=2.0",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "streamlit>=1.35"]

[project.scripts]
bonus-ab-test = "bonus_ab_test.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
